<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Social Sales Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f9;
      --panel: #ffffff;
      --ink: #18212f;
      --muted: #667085;
      --line: #d8dee8;
      --primary: #0a66c2;
      --primary-soft: #e8f2ff;
      --green: #13795b;
      --danger: #b42318;
      --side: #172231;
      --shadow: 0 12px 28px rgba(16, 24, 40, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      font-size: 44px;
      letter-spacing: 0;
    }
    button, input, textarea, select {
      font: inherit;
      letter-spacing: 0;
    }
    button {
      border: 1px solid var(--line);
      border-radius: 7px;
      min-height: 82px;
      padding: 18px 30px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-weight: 650;
      font-size: 44px;
    }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button.success { border-color: var(--green); color: var(--green); }
    button.danger { border-color: #f2b8b5; color: var(--danger); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input, textarea, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 18px 24px;
      background: #fff;
      color: var(--ink);
      font-size: 44px;
    }
    textarea { resize: vertical; line-height: 1.6; min-height: 260px; font-size: 36px; }
    label { display: block; color: var(--muted); font-size: 44px; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 72px; line-height: 1.08; }
    h2 { margin: 0; font-size: 60px; }
    h3 { margin: 0; font-size: 52px; }
    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 520px minmax(0, 1fr);
    }
    aside {
      background: var(--side);
      color: #eef3f8;
      padding: 34px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      margin-bottom: 22px;
      font-size: 44px;
    }
    .brand-mark {
      width: 70px;
      height: 70px;
      border-radius: 7px;
      background: var(--primary);
      display: grid;
      place-items: center;
    }
    .draft-list { display: grid; gap: 12px; }
    .draft-button {
      width: 100%;
      text-align: left;
      color: inherit;
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.14);
      padding: 28px;
    }
    .draft-button[aria-current="true"] {
      background: rgba(10, 102, 194, 0.36);
      border-color: #8cc6ff;
    }
    .draft-title { display: block; font-weight: 650; margin-bottom: 12px; }
    .draft-meta { display: block; color: #b8c4d2; font-size: 44px; line-height: 1.25; }
    main {
      min-width: 0;
      padding: 42px 48px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 24px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }
    .top-actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .engine-select {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      font-size: 44px;
    }
    .engine-select select { border: 0; padding: 10px 12px; min-width: 280px; }
    .subtle { color: var(--muted); font-size: 44px; line-height: 1.45; }
    .notice { color: var(--danger); font-size: 44px; margin-top: 18px; }
    .notice.busy { color: var(--primary); font-weight: 650; }
    .chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 64px;
      padding: 10px 22px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: #074f99;
      font-size: 44px;
      border: 1px solid #c7ddf7;
    }
    .stepper {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }
    .step {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 24px;
      min-height: 150px;
    }
    .step.done { border-color: #9bd3bc; background: #eefaf4; }
    .step.current { border-color: var(--primary); background: var(--primary-soft); }
    .step-state { font-size: 44px; color: var(--muted); margin-bottom: 12px; }
    .step.current .step-state { color: var(--primary); font-weight: 700; }
    .stage {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 38px;
      display: grid;
      gap: 36px;
      align-content: start;
    }
    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      flex-wrap: wrap;
    }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(620px, 1fr)); gap: 28px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
    .card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 34px;
      background: #fff;
    }
    .card.selectable { cursor: pointer; }
    .card.selectable[aria-pressed="true"] {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .candidate-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }
    .candidate-card {
      border: 2px solid var(--line);
      border-radius: 8px;
      padding: 34px;
      background: #fff;
      display: grid;
      gap: 28px;
    }
    .candidate-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    .candidate-head strong { font-size: 48px; }
    .candidate-preview {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      padding: 26px;
      color: var(--ink);
      line-height: 1.65;
      white-space: pre-wrap;
      max-height: 340px;
      font-size: 36px;
      overflow: auto;
    }
    .candidate-list {
      display: grid;
      gap: 14px;
      margin: 0;
      padding-left: 22px;
      line-height: 1.55;
    }
    .platform-card {
      min-height: 96px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 24px;
    }
    .platform-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }
    .check-row {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 650;
      font-size: 44px;
      white-space: nowrap;
    }
    .check-row input { width: 44px; height: 44px; margin: 0; }
    .topic-list { display: grid; gap: 16px; }
    .topic-card {
      display: grid;
      gap: 14px;
    }
    .topic-card strong { font-size: 52px; }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      font-size: 44px;
      color: var(--muted);
    }
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .full { grid-column: 1 / -1; }
    .master-editor { min-height: 760px; font-size: 36px; }
    .button-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .tabs { display: flex; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
    .tab[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: #fff; }
    .final-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 720px;
      gap: 24px;
      align-items: start;
    }
    .preview {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      padding: 24px;
      display: grid;
      gap: 20px;
    }
    .image-preview {
      width: 100%;
      aspect-ratio: 1.91 / 1;
      border: 1px dashed var(--line);
      border-radius: 8px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
      color: var(--muted);
    }
    .image-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .image-preview.square { aspect-ratio: 1 / 1; }
    .carousel-preview {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .carousel-thumb {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
      display: grid;
      gap: 8px;
      font-size: 44px;
      color: var(--muted);
    }
    .carousel-thumb img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }
    .carousel-thumb span { padding: 0 10px 10px; }
    .slide-png-preview {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #fff;
    }
    .slide-png-preview img { width: 100%; display: block; }
    .preview-text { white-space: pre-wrap; line-height: 1.65; font-size: 36px; }
    .slide-box {
      display: grid;
      gap: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      background: #f8fafc;
    }
    .slide-nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .status-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
      padding: 18px;
      display: grid;
      gap: 14px;
    }
    .status-box label {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      margin: 0;
      color: var(--ink);
    }
    .status-box input { width: 44px; height: 44px; }
    .skill-meta {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      font-size: 44px;
      color: var(--muted);
      line-height: 1.5;
    }
    .skill-meta strong { color: var(--ink); }
    .skill-meta code {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 1px 6px;
      background: #fff;
      color: var(--ink);
      font-family: inherit;
      font-size: 44px;
    }
    .skill-meta ul { margin: 8px 0 0; padding-left: 24px; }
    .runs {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 22px 26px;
    }
    .run-list { display: grid; gap: 14px; font-size: 44px; color: var(--muted); }
    .pill {
      display: inline-block;
      min-width: 70px;
      text-align: center;
      border-radius: 999px;
      padding: 4px 12px;
      background: var(--muted);
      color: #fff;
      font-size: 44px;
    }
    .pill.done, .pill.opened { background: var(--green); }
    .pill.working, .pill.running { background: var(--primary); }
    .pill.failed { background: var(--danger); }
    .nav-footer {
      position: sticky;
      bottom: 0;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 0 0;
      background: var(--bg);
    }
    @media (max-width: 1100px) {
      .shell { grid-template-columns: 1fr; }
      .stepper { grid-template-columns: 1fr; }
      .grid-3, .grid-2, .field-grid, .final-layout, .candidate-grid, .platform-row { grid-template-columns: 1fr; }
      aside { min-height: auto; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><div class="brand-mark">S</div><div>Social Sales</div></div>
      <div class="draft-list" id="draftList"></div>
    </aside>
    <main>
      <div class="topbar">
        <div>
          <h1>영업 콘텐츠 대시보드</h1>
          <div class="subtle">플랫폼을 고르고, 하나의 공통 원고를 검토한 뒤 최종본을 나눕니다.</div>
          <div class="chips" id="selectedPlatformChips"></div>
          <div id="busyNotice" class="notice busy"></div>
          <div id="aiNotice" class="notice"></div>
          <div id="chromeNotice" class="notice"></div>
        </div>
        <div class="top-actions">
          <label class="engine-select">엔진
            <select id="aiEngine">
              <option value="claude">Claude</option>
              <option value="codex">GPT/Codex</option>
            </select>
          </label>
          <button id="newWorkflowBtn" type="button">새 작업</button>
          <button id="saveBtn" type="button">저장</button>
        </div>
      </div>
      <div class="stepper" id="stepper"></div>
      <section class="stage" id="stage"></section>
      <section class="runs">
        <div class="section-head">
          <h3>실행 기록</h3>
          <span class="subtle">입력 완료와 게시 완료는 최종 단계에서 따로 표시합니다.</span>
        </div>
        <div id="runList" class="run-list"></div>
      </section>
      <div class="nav-footer">
        <button id="prevStepBtn" type="button">이전 단계</button>
        <button id="nextStepBtn" class="primary" type="button">다음 단계</button>
      </div>
    </main>
  </div>

  <script src="preview-data.js"></script>
  <script>
    const platforms = ["linkedin", "threads", "naver", "instagram"];
    const platformLabels = { linkedin: "LinkedIn", threads: "Threads", naver: "네이버 블로그", instagram: "Instagram" };
    const stepLabels = ["플랫폼 선택", "주제 추천", "주제 확정", "공통 원고", "최종 콘텐츠"];
    const engineLabels = { claude: "Claude", codex: "GPT/Codex" };
    const engineOrder = ["claude", "codex"];
    const $ = (id) => document.getElementById(id);

    let drafts = [];
    let selectedId = null;
    let selectedEngine = localStorage.getItem("socialSalesAiEngine") || "claude";
    let activeFinalPlatform = "linkedin";
    let instagramSlideIndex = 0;
    let aiCliStatus = "";
    let chromeDebugReady = false;
    let runs = [];
    let busyMessage = "";
    let saveTimer = null;

    const isStaticPreview = location.hostname.endsWith("github.io") || location.protocol === "file:";
    const staticPreviewData = window.SOCIAL_SALES_PREVIEW_DATA || { drafts: [], runs: [], synced_at: "" };

    async function api(path, options = {}) {
      if (isStaticPreview) return demoApi(path, options);
      const response = await fetch(path, { headers: { "Content-Type": "application/json" }, ...options });
      if (!response.ok) {
        let message = await response.text();
        try { message = JSON.parse(message).error || message; } catch {}
        throw new Error(message || response.statusText);
      }
      return response.json();
    }

    function requestBody(options = {}) {
      try { return options.body ? JSON.parse(options.body) : {}; } catch { return {}; }
    }

    function demoLoadDrafts() {
      return JSON.parse(JSON.stringify(staticPreviewData.drafts || []));
    }

    function demoSaveDrafts(items) {
      return items;
    }

    function demoTopicSuggestions(engine) {
      const prefix = engine === "codex" ? "GPT안" : "Claude안";
      return [
        {
          title: `${prefix}: 결산 전 감사 대응 체계 점검`,
          direction: "감사인이 오기 전 자료 체계를 갖춰야 감사 기간이 줄어든다는 메시지",
          targetAudience: "대표이사 · CFO · 회계팀장",
          recommendedPlatforms: "LinkedIn, 네이버, Instagram",
          contentType: "전문가 관점 글",
          reason: "결산 시즌 전 상담 문의로 연결하기 좋습니다.",
          coreMessage: "외부감사의 속도는 결산 후가 아니라 결산 전에 결정됩니다.",
          purpose: "무료 진단 상담 유도",
          mustInclude: ["감사 요청자료 표준화", "계정과목별 증빙 연결", "회계사의 판단 영역"],
          mustExclude: ["성과 보장", "검증되지 않은 고객 사례"],
          cta: "우리 회사의 준비 수준이 궁금하다면 편하게 문의해 주세요."
        },
        {
          title: `${prefix}: 반복되는 대사 업무를 줄이는 방법`,
          direction: "반복 업무를 자동화하고 담당자는 예외 항목에 집중한다는 메시지",
          targetAudience: "재무팀 · 회계팀 · 감사 담당자",
          recommendedPlatforms: "LinkedIn, Threads",
          contentType: "실무 팁",
          reason: "짧은 글과 장문 모두로 확장하기 쉽습니다.",
          coreMessage: "자동화는 판단을 대신하지 않고 판단할 시간을 만들어줍니다.",
          purpose: "전문성 홍보",
          mustInclude: ["자료 취합", "계정 대사", "예외 검토"],
          mustExclude: ["AI 만능 표현"],
          cta: "반복되는 감사 대응 업무가 있다면 메시지 주세요."
        },
        {
          title: `${prefix}: 감사 요청자료 리스트를 미리 만드는 이유`,
          direction: "매년 반복되는 요청자료를 표준화해야 결산 후 혼선을 줄일 수 있다는 메시지",
          targetAudience: "CFO · 회계팀장",
          recommendedPlatforms: "네이버, Instagram",
          contentType: "체크리스트형 콘텐츠",
          reason: "검색 유입과 상담 CTA에 적합합니다.",
          coreMessage: "준비된 요청자료 리스트는 감사 대응의 출발점입니다.",
          purpose: "문의 전환",
          mustInclude: ["표준 요청자료", "월별 결산 자료", "증빙 관리"],
          mustExclude: ["과장된 절감률"],
          cta: "현재 자료 체계를 함께 점검해드릴 수 있습니다."
        }
      ];
    }

    function demoMasterDraft(topic = {}, engine = "claude") {
      const title = topic.title || "결산 전 감사 대응 체계 점검";
      const tone = engine === "codex" ? "조금 더 구조적으로 보면," : "실무에서 자주 느끼는 점은,";
      return `${title}\n\n${tone} 외부감사는 감사인이 방문하는 날부터 시작되지 않습니다. 결산 전에 어떤 자료가 어디에 있고, 계정별 증빙이 어떻게 연결되어 있는지가 이미 감사 대응 속도를 좌우합니다.\n\n자료 요청이 들어온 뒤 파일을 찾기 시작하면 회계팀과 재무팀은 같은 설명을 반복하게 됩니다. 반대로 요청자료 목록, 계정과목별 명세서, 주요 증빙 위치가 미리 정리되어 있으면 담당자는 예외 항목과 판단이 필요한 영역에 시간을 쓸 수 있습니다.\n\n자동화는 회계사의 판단을 대신하지 않습니다. 반복되는 자료 취합과 대사 구조를 정리해 판단에 집중할 시간을 만드는 도구입니다.\n\n우리 회사의 결산 및 감사 대응 체계가 궁금하다면 편하게 문의해 주세요.\n\n한길회계법인 조경호 공인회계사\nMobile: 010-8930-9642\nE-mail: khcho@hangilac.co.kr`;
    }

    function demoPlatformDrafts(body = {}, engine = "claude") {
      const selected = Array.isArray(body.selectedPlatforms) && body.selectedPlatforms.length ? body.selectedPlatforms : platforms;
      const topic = body.selectedTopic || {};
      const title = topic.title || "결산 전 감사 대응 체계 점검";
      const drafts = {};
      if (selected.includes("linkedin")) {
        drafts.linkedin = {
          title,

    async function demoApi(path, options = {}) {
      const body = requestBody(options);
      await new Promise((resolve) => setTimeout(resolve, 180));
      if (path === "/api/state") {
        const syncedAt = staticPreviewData.synced_at ? ` · 동기화: ${staticPreviewData.synced_at}` : "";
        return {
          drafts: demoLoadDrafts(),
          runs: staticPreviewData.runs || [],
          chrome_debug_ready: true,
          ai_cli_status: `GitHub Pages 보기 전용 스냅샷${syncedAt}`,
          ai_cli_engines: { claude: false, codex: false }
        };
      }
      if (path === "/api/drafts") {
        const draft = ensureWorkflow(body);
        return { draft };
      }
      if (path === "/api/run") {
        throw new Error("GitHub Pages는 보기 전용입니다. 입력/게시 작업은 로컬 http://127.0.0.1:8765 에서 실행하세요.");
      }
      if (
        path === "/api/topic-suggestions" ||
        path === "/api/topic-suggestions-compare" ||
        path === "/api/master-draft" ||
        path === "/api/master-draft-compare" ||
        path === "/api/platform-drafts" ||
        path === "/api/platform-drafts-compare"
      ) {
        throw new Error("GitHub Pages는 로컬에서 생성한 결과만 보여줍니다. 새 생성은 http://127.0.0.1:8765 에서 해주세요.");
      }
      if (path === "/api/topic-suggestions" || path === "/api/topic-suggestions-compare") {
        const candidates = {
          claude: { suggestions: demoTopicSuggestions("claude"), source: "github-pages-demo" },
          codex: { suggestions: demoTopicSuggestions("codex"), source: "github-pages-demo" }
        };
        return path.endsWith("compare") ? { candidates } : candidates[selectedEngine];
      }
      if (path === "/api/master-draft" || path === "/api/master-draft-compare") {
        const candidates = {
          claude: { masterDraft: demoMasterDraft(body.selectedTopic, "claude"), source: "github-pages-demo" },
          codex: { masterDraft: demoMasterDraft(body.selectedTopic, "codex"), source: "github-pages-demo" }
        };
        return path.endsWith("compare") ? { candidates } : candidates[selectedEngine];
      }
      if (path === "/api/platform-drafts" || path === "/api/platform-drafts-compare") {
        const candidates = {
          claude: { platformDrafts: demoPlatformDrafts(body, "claude"), source: "github-pages-demo" },
          codex: { platformDrafts: demoPlatformDrafts(body, "codex"), source: "github-pages-demo" }
        };
        return path.endsWith("compare") ? { candidates } : candidates[selectedEngine];
      }
      if (path === "/api/run") {
        runs.unshift({ status: "opened", platform: body.platform, title: currentDraft().title, started_at: new Date().toLocaleString("ko-KR") });
        return { ok: true };
      }
      return {};
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[char]);
    }

    function toLines(value) {
      if (Array.isArray(value)) return value.map(String).filter(Boolean).join("\n");
      return String(value || "");
    }

    function fromLines(value) {
      return String(value || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
    }

    function createBlankDraft() {
      const id = crypto.randomUUID();
      return ensureWorkflow({
        id,
        created_at: new Date().toISOString().slice(0, 10),
        title: "새 영업 콘텐츠",
        status: "draft",
        selectedPlatforms: ["linkedin", "threads", "naver", "instagram"],
        topicSuggestions: [],
        selectedTopic: {},
        masterDraft: "",
        platformDrafts: {},
        engineCandidates: { topics: {}, masterDrafts: {}, platformDrafts: {} },
        variants: {},
        generation_source: "manual",
        ai_engine: selectedEngine,
        workflowStatus: { currentStep: 1, masterDraftReviewed: false },
        inputCompleted: { linkedin: false, threads: false, naver: false, instagram: false },
        published: { linkedin: false, threads: false, naver: false, instagram: false },
        posted: { linkedin: false, threads: false, naver: false, instagram: false }
      });
    }

    function ensureFlags(value) {
      const source = value || {};
      const flags = {};
      platforms.forEach((platform) => { flags[platform] = Boolean(source[platform]); });
      return flags;
    }

    function ensureWorkflow(draft) {
      const copy = { ...draft };
      copy.selectedPlatforms = Array.isArray(copy.selectedPlatforms)
        ? copy.selectedPlatforms.filter((platform) => platforms.includes(platform))
        : ["linkedin", "naver", "instagram"];
      if (!copy.selectedPlatforms.length) copy.selectedPlatforms = ["linkedin"];
      copy.topicSuggestions = Array.isArray(copy.topicSuggestions) ? copy.topicSuggestions : [];
      copy.selectedTopic = copy.selectedTopic && typeof copy.selectedTopic === "object" ? copy.selectedTopic : {};
      copy.platformDrafts = copy.platformDrafts && typeof copy.platformDrafts === "object" ? copy.platformDrafts : {};
      copy.engineCandidates = copy.engineCandidates && typeof copy.engineCandidates === "object" ? copy.engineCandidates : {};
      copy.engineCandidates.topics = copy.engineCandidates.topics && typeof copy.engineCandidates.topics === "object" ? copy.engineCandidates.topics : {};
      copy.engineCandidates.masterDrafts = copy.engineCandidates.masterDrafts && typeof copy.engineCandidates.masterDrafts === "object" ? copy.engineCandidates.masterDrafts : {};
      copy.engineCandidates.platformDrafts = copy.engineCandidates.platformDrafts && typeof copy.engineCandidates.platformDrafts === "object" ? copy.engineCandidates.platformDrafts : {};
      copy.variants = copy.variants && typeof copy.variants === "object" ? copy.variants : {};
      platforms.forEach((platform) => {
        if (!copy.platformDrafts[platform] && copy.variants[platform]) {
          copy.platformDrafts[platform] = { ...copy.variants[platform] };
        }
      });
      copy.workflowStatus = copy.workflowStatus && typeof copy.workflowStatus === "object" ? copy.workflowStatus : {};
      copy.workflowStatus.currentStep = Math.min(5, Math.max(1, Number(copy.workflowStatus.currentStep || 1)));
      copy.workflowStatus.masterDraftReviewed = Boolean(copy.workflowStatus.masterDraftReviewed);
      copy.inputCompleted = ensureFlags(copy.inputCompleted || copy.posted);
      copy.published = ensureFlags(copy.published);
      copy.posted = ensureFlags(copy.posted);
      copy.ai_engine = copy.ai_engine || selectedEngine;
      copy.generation_source = copy.generation_source || "manual";
      return copy;
    }

    function currentDraft() {
      let draft = drafts.find((item) => item.id === selectedId);
      if (!draft) {
        draft = createBlankDraft();
        drafts.unshift(draft);
        selectedId = draft.id;
      }
      return draft;
    }

    function currentStep() {
      return currentDraft().workflowStatus.currentStep || 1;
    }

    function setStep(step) {
      currentDraft().workflowStatus.currentStep = Math.min(5, Math.max(1, step));
      queueSave();
      render();
    }

    function topicTitle(draft) {
      return draft.selectedTopic?.title || draft.title || "새 영업 콘텐츠";
    }

    function imageSrc(path) {
      const fileName = String(path || "").split(/[\\/]/).pop();
      if (!fileName) return "";
      const prefix = isStaticPreview ? "assets/" : "/assets/";
      return `${prefix}${encodeURIComponent(fileName)}`;
    }

    function instagramImagePaths(item) {
      const fromSlides = Array.isArray(item.slides)
        ? item.slides.map((slide) => slide?.image_path).filter(Boolean)
        : [];
      const fromItem = Array.isArray(item.carousel_image_paths) ? item.carousel_image_paths.filter(Boolean) : [];
      return fromSlides.length ? fromSlides : fromItem;
    }

    function platformText(platform, draft = currentDraft()) {
      const item = draft.platformDrafts?.[platform] || {};
      if (platform === "linkedin") {
        const composed = ["opener", "body", "insight", "cta", "hashtags"].map((key) => item[key]).filter(Boolean).join("\n\n");
        return composed || String(item.text || "");
      }
      if (platform === "threads") {
        const composed = ["hook", "body", "insight", "conversationPrompt", "hashtags"].map((key) => item[key]).filter(Boolean).join("\n\n");
        return composed || String(item.text || "");
      }
      if (platform === "naver") {
        const parts = [
          `제목 후보\n${(item.titleCandidates || []).map((value) => `- ${value}`).join("\n")}`,
          `최종 추천 제목\n${item.finalTitle || item.title || ""}`,
          `핵심 검색어\n${item.keywords || ""}`,
          `요약문\n${item.summary || ""}`,
          `소제목\n${(item.subheads || []).map((value) => `- ${value}`).join("\n")}`,
          item.body || "",
          `FAQ\n${(item.faq || []).map((value) => `- ${value}`).join("\n")}`,
          `이미지 위치\n${item.imagePlacement || ""}`,
          `문의 문구\n${item.inquiry || ""}`
        ];
        const composed = parts.filter((part) => part.trim()).join("\n\n");
        return composed || String(item.text || "");
      }
      return [item.caption || "", item.hashtags || ""].filter(Boolean).join("\n\n");
    }

    function clipText(value, limit = 520) {
      const text = String(value || "").trim();
      return text.length > limit ? `${text.slice(0, limit).trim()}...` : text;
    }

    function candidateEntries(bucket) {
      const source = bucket && typeof bucket === "object" ? bucket : {};
      return engineOrder
        .map((engine) => [engine, source[engine]])
        .filter(([, value]) => value && typeof value === "object");
    }

    function renderTopicEngineChoices(draft) {
      const entries = candidateEntries(draft.engineCandidates?.topics)
        .filter(([, value]) => Array.isArray(value.suggestions) && value.suggestions.length);
      if (!entries.length) return "";
      return `
        <div>
          <h3>Claude / GPT 추천안 중 선택</h3>
          <div class="candidate-grid">
            ${entries.map(([engine, value]) => `
              <section class="candidate-card">
                <div class="candidate-head">
                  <strong>${escapeHtml(engineLabels[engine] || engine)}</strong>
                  <button data-use-topic-engine="${engine}" type="button">이 추천안 사용</button>
                </div>
                <ol class="candidate-list">
                  ${value.suggestions.slice(0, 4).map((topic) => `<li><strong>${escapeHtml(topic.title || "")}</strong><br><span class="subtle">${escapeHtml(topic.direction || topic.reason || "")}</span></li>`).join("")}
                </ol>
                <div class="subtle">출처: ${escapeHtml(value.source || "")}</div>
              </section>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderMasterEngineChoices(draft) {
      const entries = candidateEntries(draft.engineCandidates?.masterDrafts)
        .filter(([, value]) => String(value.masterDraft || "").trim());
      if (!entries.length) return "";
      return `
        <div>
          <h3>Claude / GPT 공통 원고 중 선택</h3>
          <div class="candidate-grid">
            ${entries.map(([engine, value]) => `
              <section class="candidate-card">
                <div class="candidate-head">
                  <strong>${escapeHtml(engineLabels[engine] || engine)}</strong>
                  <button data-use-master-engine="${engine}" type="button">이 원고 사용</button>
                </div>
                <div class="candidate-preview">${escapeHtml(clipText(value.masterDraft, 900))}</div>
                <div class="subtle">출처: ${escapeHtml(value.source || "")}</div>
              </section>
            `).join("")}
          </div>
        </div>
      `;
    }

    function renderPlatformEngineChoices(draft, platform) {
      const entries = candidateEntries(draft.engineCandidates?.platformDrafts)
        .map(([engine, value]) => [engine, value, value.platformDrafts?.[platform]])
        .filter(([, , item]) => item && typeof item === "object");
      if (!entries.length) return "";
      return `
        <div class="candidate-card">
          <div class="candidate-head">
            <strong>${escapeHtml(platformLabels[platform])} Claude / GPT 안 선택</strong>
            <span class="subtle">마음에 드는 안을 누르면 아래 편집창에 들어갑니다.</span>
          </div>
          <div class="candidate-grid">
            ${entries.map(([engine, value, item]) => {
              const text = platformText(platform, { platformDrafts: { [platform]: item } });
              return `
                <section class="candidate-card">
                  <div class="candidate-head">
                    <strong>${escapeHtml(engineLabels[engine] || engine)}</strong>
                    <button data-use-platform-engine="${engine}" type="button">이 최종본 사용</button>
                  </div>
                  <div class="candidate-preview">${escapeHtml(clipText(text, platform === "instagram" ? 260 : 700))}</div>
                  <div class="subtle">출처: ${escapeHtml(value.source || "")}</div>
                </section>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function renderSkillPackMeta(platform, item) {
      const pack = item.skillPack || {};
      if (!pack.source) return "";
      const admin = pack.admin && typeof pack.admin === "object" ? pack.admin : {};
      const qa = pack.qa && typeof pack.qa === "object" ? pack.qa : (admin.qa && typeof admin.qa === "object" ? admin.qa : {});
      const keyMap = {
        linkedin: ["angle", "audience", "positioning"],
        threads: ["angle", "conversation_goal"],
        naver: ["primary_query", "search_intent"],
        instagram: ["strategy"]
      };
      const adminLines = (keyMap[platform] || [])
        .map((key) => [key, admin[key]])
        .filter(([, value]) => value !== undefined && value !== null && String(value).trim())
        .map(([key, value]) => `<li>${escapeHtml(key)}: ${escapeHtml(String(value)).slice(0, 180)}</li>`)
        .join("");
      const issues = Array.isArray(qa.issues)
        ? qa.issues.slice(0, 3).map((issue) => `<li>${escapeHtml(issue.problem || issue.fix || JSON.stringify(issue)).slice(0, 180)}</li>`).join("")
        : "";
      const status = pack.error
        ? `<div>상태: <code>fallback</code> ${escapeHtml(pack.error)}</div>`
        : `<div>상태: <code>${escapeHtml(pack.source)}</code></div>`;
      const qaLine = qa.score !== undefined
        ? `<div>QA: <code>${escapeHtml(String(qa.score))}/100</code>${qa.pass === false ? " · 수정 반영 필요" : ""}</div>`
        : "";
      return `
        <div class="skill-meta">
          <strong>스킬팩 적용 정보</strong>
          ${status}
          <div>schema: <code>${escapeHtml(pack.schema || `${platform}_output.schema.json`)}</code></div>
          ${qaLine}
          ${adminLines ? `<ul>${adminLines}</ul>` : ""}
          ${issues ? `<ul>${issues}</ul>` : ""}
        </div>
      `;
    }

    function renderInstagramCarouselPreview(item) {
      const paths = instagramImagePaths(item);
      if (!paths.length) {
        return `<div class="image-preview square">캐러셀 PNG 없음</div>`;
      }
      return `
        <div class="carousel-preview">
          ${paths.slice(0, 7).map((path, idx) => `
            <div class="carousel-thumb">
              <img alt="Instagram ${idx + 1}장" src="${imageSrc(path)}">
              <span>${idx + 1}장 PNG</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function syncVariants(draft = currentDraft()) {
      draft.variants = draft.variants || {};
      platforms.forEach((platform) => {
        const item = draft.platformDrafts?.[platform] || {};
        draft.variants[platform] = {
          title: item.finalTitle || item.title || draft.selectedTopic?.title || draft.title || "제목 없음",
          image_path: item.image_path || "",
          text: platformText(platform, draft)
        };
      });
      const primaryPlatform = draft.selectedPlatforms.includes("linkedin") ? "linkedin" : draft.selectedPlatforms[0];
      const primary = draft.variants[primaryPlatform] || {};
      draft.title = primary.title || topicTitle(draft);
      draft.text = primary.text || "";
      draft.image_path = primary.image_path || "";
      draft.posted = { ...draft.published };
      return draft;
    }

    function render() {
      syncVariants(currentDraft());
      renderDraftList();
      renderTop();
      renderStepper();
      renderStep();
      renderFooter();
      renderRuns();
      applyStaticPreviewMode();
    }

    function renderDraftList() {
      $("draftList").innerHTML = "";
      drafts.forEach((draft) => {
        const step = draft.workflowStatus?.currentStep || 1;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "draft-button";
        button.setAttribute("aria-current", draft.id === selectedId ? "true" : "false");
        button.innerHTML = `<span class="draft-title">${escapeHtml(topicTitle(draft))}</span><span class="draft-meta">${escapeHtml(stepLabels[step - 1] || "작업")} · ${escapeHtml(draft.created_at || "")}</span>`;
        button.addEventListener("click", async () => {
          await saveCurrent(true);
          selectedId = draft.id;
          activeFinalPlatform = currentDraft().selectedPlatforms[0] || "linkedin";
          render();
        });
        $("draftList").appendChild(button);
      });
    }

    function renderTop() {
      $("aiEngine").value = selectedEngine;
      $("selectedPlatformChips").innerHTML = currentDraft().selectedPlatforms
        .map((platform) => `<span class="chip">${escapeHtml(platformLabels[platform])}</span>`)
        .join("");
      $("busyNotice").textContent = busyMessage;
      $("aiNotice").textContent = isStaticPreview
        ? (aiCliStatus || "GitHub Pages 보기 전용 스냅샷")
        : (aiCliStatus ? `AI CLI: ${aiCliStatus}` : "");
      $("chromeNotice").textContent = isStaticPreview
        ? "새 생성/저장/입력/게시 없이 로컬에서 복사한 결과만 보여줍니다."
        : chromeDebugReady
        ? ""
        : "Chrome 9222 창이 꺼져 있으면 최종 입력 버튼이 동작하지 않습니다.";
    }

    function renderStepper() {
      const step = currentStep();
      $("stepper").innerHTML = stepLabels.map((label, index) => {
        const number = index + 1;
        const state = number < step ? "done" : (number === step ? "current" : "");
        const mark = number < step ? "✓" : (number === step ? "●" : "○");
        return `<div class="step ${state}"><div class="step-state">${mark} ${number}단계</div><strong>${escapeHtml(label)}</strong></div>`;
      }).join("");
    }

    function renderStep() {
      const step = currentStep();
      if (step === 1) renderStepPlatforms();
      if (step === 2) renderStepTopics();
      if (step === 3) renderStepConfirmTopic();
      if (step === 4) renderStepMasterDraft();
      if (step === 5) renderStepFinalContent();
    }

    function renderStepPlatforms() {
      const draft = currentDraft();
      $("stage").innerHTML = `
        <div class="section-head">
          <div><h2>어디에 게시하시겠습니까?</h2><div class="subtle">한 개 이상 선택합니다. 선택한 플랫폼만 최종 단계에 표시됩니다.</div></div>
        </div>

            <label class="card platform-card selectable" aria-pressed="${draft.selectedPlatforms.includes(platform)}">

            </label>
          `).join("")}
        </div>
      `;

        input.addEventListener("change", () => {
          const platform = input.dataset.platform;
          const selected = new Set(draft.selectedPlatforms);

    }

        draft.selectedTopic = {
          ...draft.selectedTopic,
          title: $("topicTitle").value.trim(),
          coreMessage: $("coreMessage").value.trim(),

          mustExclude: fromLines($("mustExclude").value),
          cta: $("cta").value.trim()
        };

    function bindPlatformEditor(platform) {
      const draft = currentDraft();
      const item = draft.platformDrafts[platform] = draft.platformDrafts[platform] || {};
      const updateText = () => {
        item.text = platformText(platform, draft);
        syncVariants(draft);
        queueSave();
      };
      const setValue = (key, id) => {
        const el = $(id);
        if (!el) return;
        el.addEventListener("input", () => { item[key] = el.value; updateText(); renderTop(); });
      };
      if (platform === "linkedin") {
        ["opener", "body", "insight", "cta", "hashtags", "imageSuggestion"].forEach((key) => setValue(key, key));
      }
      if (platform === "threads") {
        ["hook", "body", "insight", "conversationPrompt", "hashtags", "imageSuggestion"].forEach((key) => setValue(key, key));
      }
      if (platform === "naver") {
        [["titleCandidates", "titleCandidates"], ["finalTitle", "finalTitle"], ["keywords", "keywords"], ["summary", "summary"], ["subheads", "subheads"], ["body", "body"], ["faq", "faq"], ["imagePlacement", "imagePlacement"], ["inquiry", "inquiry"]].forEach(([key, id]) => {
          const el = $(id);
          if (!el) return;
          el.addEventListener("input", () => {
            item[key] = ["titleCandidates", "subheads", "faq"].includes(key) ? fromLines(el.value) : el.value;
            item.title = item.finalTitle || item.title;
            updateText();
          });
        });
      }
      if (platform === "instagram") {
        item.slides = Array.isArray(item.slides) && item.slides.length ? item.slides : [{ title: "", body: "", emphasis: "", character: "", pose: "", visual: "", imagePrompt: "" }];
        const slide = item.slides[instagramSlideIndex];
        [["slideTitle", "title"], ["slideBody", "body"], ["slideEmphasis", "emphasis"], ["slideCharacter", "character"], ["slidePose", "pose"], ["slideVisual", "visual"], ["slidePrompt", "imagePrompt"]].forEach(([id, key]) => {
          $(id).addEventListener("input", () => { slide[key] = $(id).value; updateText(); });
        });
        $("coverOptions").addEventListener("input", () => { item.coverOptions = fromLines($("coverOptions").value); updateText(); });
        $("caption").addEventListener("input", () => {
          const caption = $("caption");
          if (caption.value.length > 50) caption.value = caption.value.slice(0, 50);
          item.caption = caption.value;
          updateText();
        });
        $("hashtags").addEventListener("input", () => { item.hashtags = $("hashtags").value; updateText(); });
        $("prevSlide").addEventListener("click", () => { instagramSlideIndex = Math.max(0, instagramSlideIndex - 1); renderPlatformEditor(platform); });
        $("nextSlide").addEventListener("click", () => { instagramSlideIndex = Math.min(item.slides.length - 1, instagramSlideIndex + 1); renderPlatformEditor(platform); });
      }
      $("inputDone").addEventListener("change", () => { draft.inputCompleted[platform] = $("inputDone").checked; queueSave(); });
      $("publishedDone").addEventListener("change", () => { draft.published[platform] = $("publishedDone").checked; draft.posted[platform] = $("publishedDone").checked; queueSave(); });
      $("finalEditor").querySelector("[data-action='copy']").addEventListener("click", async () => {
        await navigator.clipboard.writeText(platformText(platform));
        alert(`${platformLabels[platform]} 최종본을 복사했습니다.`);
      });
      $("finalEditor").querySelector("[data-action='run']").addEventListener("click", () => runCurrent(platform));
      $("finalEditor").querySelectorAll("[data-platform-tool]").forEach((button) => {
        button.addEventListener("click", () => regeneratePlatformDrafts(button.dataset.platformTool));
      });
    }

    function renderFooter() {
      const step = currentStep();
      $("prevStepBtn").disabled = step === 1;
      $("nextStepBtn").disabled = isStaticPreview ? false : !canGoNext();
      $("nextStepBtn").textContent = isStaticPreview
        ? (step === 5 ? "처음 단계" : "다음 단계 보기")
        : step === 1 ? "다음: 주제 추천"
        : step === 2 ? "다음: 주제 확정"
        : step === 3 ? "선택한 주제로 원고 작성"
        : step === 4 ? "플랫폼별 최종본 만들기"
        : "완료";
    }

    function canGoNext() {
      const draft = currentDraft();
      const step = currentStep();
      if (step === 1) return draft.selectedPlatforms.length > 0;
      if (step === 2) return Boolean(draft.selectedTopic?.title);
      if (step === 3) return Boolean(draft.selectedTopic?.title);
      if (step === 4) return Boolean(draft.masterDraft?.trim());
      return false;
    }

    async function nextStep() {
      const step = currentStep();
      if (isStaticPreview) {
        setStep(step === 5 ? 1 : step + 1);
        return;
      }
      if (step === 1) {
        if (!currentDraft().topicSuggestions.length) await generateTopicsCompare();
        else setStep(2);
      } else if (step === 2) {
        setStep(3);
      } else if (step === 3) {
        await generateMasterDraftsCompare("");
      } else if (step === 4) {
        await generatePlatformDraftsCompare();
      }
    }

    async function generateTopics() {
      const draft = currentDraft();
      await saveCurrent(true);
      await withBusy("AI가 주제를 추천하는 중입니다.", async () => {
        const result = await api("/api/topic-suggestions", {
          method: "POST",
          body: JSON.stringify({ engine: selectedEngine, selectedPlatforms: draft.selectedPlatforms })
        });
        draft.topicSuggestions = result.suggestions || [];
        draft.generation_source = result.source || draft.generation_source;
        draft.workflowStatus.currentStep = 2;
        await saveCurrent(true);
      });
      render();
    }

    async function generateTopicsCompare() {
      const draft = currentDraft();
      await saveCurrent(true);
      await withBusy("Claude와 GPT가 각각 주제를 추천하는 중입니다.", async () => {
        const result = await api("/api/topic-suggestions-compare", {
          method: "POST",
          body: JSON.stringify({ selectedPlatforms: draft.selectedPlatforms })
        });
        draft.engineCandidates = draft.engineCandidates || { topics: {}, masterDrafts: {}, platformDrafts: {} };
        draft.engineCandidates.topics = result.candidates || {};
        const first = engineOrder.find((engine) => draft.engineCandidates.topics?.[engine]?.suggestions?.length);
        if (first) {
          draft.topicSuggestions = draft.engineCandidates.topics[first].suggestions;
          draft.generation_source = draft.engineCandidates.topics[first].source || draft.generation_source;
        }
        draft.workflowStatus.currentStep = 2;
        await saveCurrent(true);
      });
      render();
    }

    async function generateMasterDraft(instruction) {
      const draft = currentDraft();
      await saveCurrent(true);
      await withBusy("AI가 공통 원고를 작성하는 중입니다.", async () => {
        const result = await api("/api/master-draft", {
          method: "POST",
          body: JSON.stringify({
            engine: selectedEngine,
            selectedPlatforms: draft.selectedPlatforms,
            selectedTopic: draft.selectedTopic,
            rewriteInstruction: instruction
          })
        });
        draft.masterDraft = result.masterDraft || "";
        draft.generation_source = result.source || draft.generation_source;
        draft.workflowStatus.currentStep = 4;
        draft.workflowStatus.masterDraftReviewed = false;
        await saveCurrent(true);
      });
      render();
    }

    async function generateMasterDraftsCompare(instruction) {
      const draft = currentDraft();
      await saveCurrent(true);
      await withBusy("Claude와 GPT가 각각 공통 원고를 작성하는 중입니다.", async () => {
        const result = await api("/api/master-draft-compare", {
          method: "POST",
          body: JSON.stringify({
            selectedPlatforms: draft.selectedPlatforms,
            selectedTopic: draft.selectedTopic,
            rewriteInstruction: instruction
          })
        });
        draft.engineCandidates = draft.engineCandidates || { topics: {}, masterDrafts: {}, platformDrafts: {} };
        draft.engineCandidates.masterDrafts = result.candidates || {};
        const first = engineOrder.find((engine) => String(draft.engineCandidates.masterDrafts?.[engine]?.masterDraft || "").trim());
        if (first) {
          draft.masterDraft = draft.engineCandidates.masterDrafts[first].masterDraft || "";
          draft.generation_source = draft.engineCandidates.masterDrafts[first].source || draft.generation_source;
          draft.workflowStatus.currentStep = 4;
          draft.workflowStatus.masterDraftReviewed = false;
        }
        await saveCurrent(true);
      });
      render();
    }

    async function generatePlatformDrafts() {
      const draft = currentDraft();
      draft.masterDraft = $("masterDraft") ? $("masterDraft").value : draft.masterDraft;
      await saveCurrent(true);
      await withBusy("AI가 플랫폼별 최종본과 이미지를 만드는 중입니다.", async () => {
        const result = await api("/api/platform-drafts", {
          method: "POST",
          body: JSON.stringify({
            engine: selectedEngine,
            selectedPlatforms: draft.selectedPlatforms,
            selectedTopic: draft.selectedTopic,
            masterDraft: draft.masterDraft
          })
        });
        draft.platformDrafts = { ...draft.platformDrafts, ...(result.platformDrafts || {}) };
        draft.generation_source = result.source || draft.generation_source;
        draft.workflowStatus.currentStep = 5;
        activeFinalPlatform = draft.selectedPlatforms[0] || "linkedin";
        syncVariants(draft);
        await saveCurrent(true);
      });
      render();
    }

    async function generatePlatformDraftsCompare() {
      const draft = currentDraft();
      draft.masterDraft = $("masterDraft") ? $("masterDraft").value : draft.masterDraft;
      await saveCurrent(true);
      await withBusy("Claude와 GPT가 각각 플랫폼별 최종본과 이미지를 만드는 중입니다.", async () => {
        const result = await api("/api/platform-drafts-compare", {
          method: "POST",
          body: JSON.stringify({
            selectedPlatforms: draft.selectedPlatforms,
            selectedTopic: draft.selectedTopic,
            masterDraft: draft.masterDraft
          })
        });
        draft.engineCandidates = draft.engineCandidates || { topics: {}, masterDrafts: {}, platformDrafts: {} };
        draft.engineCandidates.platformDrafts = result.candidates || {};
        const first = engineOrder.find((engine) => draft.engineCandidates.platformDrafts?.[engine]?.platformDrafts);
        if (first) {
          draft.platformDrafts = { ...draft.platformDrafts, ...(draft.engineCandidates.platformDrafts[first].platformDrafts || {}) };
          draft.generation_source = draft.engineCandidates.platformDrafts[first].source || draft.generation_source;
        }
        draft.workflowStatus.currentStep = 5;
        activeFinalPlatform = draft.selectedPlatforms[0] || "linkedin";
        syncVariants(draft);
        await saveCurrent(true);
      });
      render();
    }

    async function regeneratePlatformDrafts(reason) {
      const draft = currentDraft();
      const note = reason ? ` (${reason})` : "";
      await withBusy(`${platformLabels[activeFinalPlatform]} 최종본을 다시 만드는 중입니다${note}.`, async () => {
        const result = await api("/api/platform-drafts", {
          method: "POST",
          body: JSON.stringify({
            engine: selectedEngine,
            selectedPlatforms: [activeFinalPlatform],
            selectedTopic: draft.selectedTopic,
            masterDraft: `${draft.masterDraft}\n\n수정 요청: ${reason}`
          })
        });
        draft.platformDrafts = { ...draft.platformDrafts, ...(result.platformDrafts || {}) };
        syncVariants(draft);
        await saveCurrent(true);
      });
      render();
    }

    async function runCurrent(platform) {
      const draft = currentDraft();
      syncVariants(draft);
      if (!draft.variants[platform]?.text) {
        alert(`${platformLabels[platform]} 최종본을 먼저 작성해 주세요.`);
        return;
      }
      await saveCurrent(true);
      await api("/api/run", { method: "POST", body: JSON.stringify({ id: draft.id, platform, mode: "draft" }) });
      alert(`${platformLabels[platform]} 입력을 시작했습니다. 최종 게시/발행 버튼은 직접 눌러 주세요.`);
      await refreshStatus();
    }

    async function withBusy(message, task) {
      busyMessage = message;
      renderTop();
      $("nextStepBtn").disabled = true;
      try {
        await task();
      } catch (error) {
        alert(error.message);
      } finally {
        busyMessage = "";
        renderTop();
      }
    }

    async function saveCurrent(silent = true) {
      if (isStaticPreview) return;
      const draft = syncVariants(currentDraft());
      const result = await api("/api/drafts", { method: "POST", body: JSON.stringify(draft) });
      const index = drafts.findIndex((item) => item.id === result.draft.id);
      const normalized = ensureWorkflow(result.draft);
      if (index >= 0) Object.assign(drafts[index], normalized);
      else drafts.unshift(normalized);
      selectedId = result.draft.id;
      if (!silent) alert("저장했습니다.");
    }

    function queueSave() {
      if (isStaticPreview) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveCurrent(true).catch(console.error), 600);
    }

    async function load() {
      const data = await api("/api/state");
      drafts = (data.drafts || []).map(ensureWorkflow);
      chromeDebugReady = Boolean(data.chrome_debug_ready);
      aiCliStatus = data.ai_cli_status || "";
      runs = data.runs || [];
      $("aiEngine").value = selectedEngine;
      if (!drafts.length) drafts = [createBlankDraft()];
      selectedId = selectedId || drafts[0].id;
      activeFinalPlatform = currentDraft().selectedPlatforms[0] || "linkedin";
      render();
    }

    function applyStaticPreviewMode() {
      if (!isStaticPreview) return;
      const blockedButtons = [
        "#newWorkflowBtn",
        "#saveBtn",
        "#regenerateTopicsBtn",
        "#compareTopicsBtn",
        "#manualTopicBtn",
        "#writeMasterBtn",
        "#compareMasterBtn",
        "#saveMasterBtn",
        "#makeFinalBtn",
        "#makeFinalCompareBtn",
        "[data-rewrite]",
        "[data-platform-tool]",
        "[data-use-topic-engine]",
        "[data-use-master-engine]",
        "[data-use-platform-engine]",
        "[data-action='run']"
      ].join(",");
      document.querySelectorAll(blockedButtons).forEach((button) => {
        button.disabled = true;
        button.title = "GitHub Pages는 보기 전용입니다. 새 생성은 로컬 대시보드에서 해주세요.";
      });
      $("aiEngine").disabled = true;
      document.querySelectorAll("#stage input, #stage textarea, #stage select").forEach((field) => {
        if (field.type === "checkbox") field.disabled = true;
        else field.readOnly = true;
        field.title = "보기 전용 스냅샷입니다.";
      });
    }

    async function refreshStatus() {
      const data = await api("/api/state");
      chromeDebugReady = Boolean(data.chrome_debug_ready);
      aiCliStatus = data.ai_cli_status || "";
      runs = data.runs || [];
      renderTop();
      renderRuns();
    }

    function renderRuns() {
      $("runList").innerHTML = "";
      if (!runs.length) {
        $("runList").textContent = "아직 실행 기록이 없습니다.";
        return;
      }
      runs.slice(0, 8).forEach((run) => {
        const row = document.createElement("div");
        const platform = platformLabels[run.platform] || run.platform || "입력";
        row.innerHTML = `<span class="pill ${escapeHtml(run.status)}">${escapeHtml(run.status)}</span> <strong>${escapeHtml(platform)} 입력</strong> <span>· ${escapeHtml(run.title || run.draft_id || "")} · ${escapeHtml(run.started_at || "")}</span>`;
        $("runList").appendChild(row);
      });
    }

    $("prevStepBtn").addEventListener("click", () => setStep(currentStep() - 1));
    $("nextStepBtn").addEventListener("click", nextStep);
    $("saveBtn").addEventListener("click", () => saveCurrent(false));
    $("newWorkflowBtn").addEventListener("click", async () => {
      await saveCurrent(true);
      const draft = createBlankDraft();
      drafts.unshift(draft);
      selectedId = draft.id;
      activeFinalPlatform = "linkedin";
      await saveCurrent(true);
      render();
    });
    $("aiEngine").addEventListener("change", () => {
      selectedEngine = $("aiEngine").value || "claude";
      localStorage.setItem("socialSalesAiEngine", selectedEngine);
      currentDraft().ai_engine = selectedEngine;
      queueSave();
    });

    load();
    if (!isStaticPreview) setInterval(refreshStatus, 5000);
  </script>
</body>
</html>
